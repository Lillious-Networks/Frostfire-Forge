services:
  frostfire-forge-prod:
    build:
      context: ../../
      dockerfile: src/docker/Dockerfile.prod
    container_name: frostfire-forge-prod
    restart: always
    # The engine's shutdown takes up to 9 s (running handoffs, achievement flush, leaving the cluster).
    stop_grace_period: 20s
    network_mode: "host"
    env_file:
      - ../../.env.production
    volumes:
      - ../../src/certs:/app/src/certs
      - ../../src/logs:/app/src/logs
      - ../../src/config:/app/src/config
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576