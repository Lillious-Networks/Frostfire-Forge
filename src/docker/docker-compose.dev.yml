services:
  frostfire-forge-dev:
    build:
      context: ../../
      dockerfile: src/docker/Dockerfile.dev
    container_name: frostfire-forge-dev
    restart: always
    ports:
      - "3000:3000"
      - "3000:3000/udp"
    env_file:
      - ../../.env.development
    volumes:
      - ../../src/certs:/app/src/certs
      - ../../src/logs:/app/src/logs
      - ../../src/config:/app/src/config
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks:
      - frostfire-network-dev

networks:
  frostfire-network-dev:
    driver: bridge
